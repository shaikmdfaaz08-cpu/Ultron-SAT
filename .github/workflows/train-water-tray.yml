name: Train experimental water tray RGB classifier

on:
  push:
    branches: [main]
    paths:
      - 'A.I/train_water_tray_prototype.py'
      - 'experiments/water_tray_2026_11_09/**'
      - '.github/workflows/train-water-tray.yml'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dataset and training script
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.24,<3' 'Pillow>=10,<13' 'scikit-learn>=1.4,<2'
      - name: Train visible dark patch prototype
        run: |
          python A.I/train_water_tray_prototype.py --data experiments/water_tray_2026_11_09 --out runs/water_tray_prototype
      - name: Publish experimental model and report
        uses: actions/upload-artifact@v4
        with:
          name: water-tray-prototype
          path: runs/water_tray_prototype/
          if-no-files-found: error
          retention-days: 14
