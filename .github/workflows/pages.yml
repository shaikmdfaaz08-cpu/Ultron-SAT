name: Publish ULTRON-SAT static dashboard
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      - 'build_static_dashboard.py'
      - 'export_browser_model.py'
      - 'runs/oil_unet_full/best.pt'
      - 'experiments/water_tray_2026_11_09/prototype_model.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: python build_static_dashboard.py
      - name: Install trained model conversion dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check segmentation-models-pytorch==0.6.0 onnx==1.17.0 onnxruntime==1.20.1
      - name: Export and validate real trained U-Net for browser
        run: python export_browser_model.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4

# Redeploy marker: republish committed dashboard assets without changing site code.
